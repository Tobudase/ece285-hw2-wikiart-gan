apiVersion: batch/v1
kind: Job
metadata:
  name: hw2-wikiart-a100-v1
  labels:
    app: hw2-wikiart-gan-v1
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 14400
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: hw2-wikiart-gan-v1
    spec:
      automountServiceAccountToken: false
      restartPolicy: Never
      containers:
      - name: train
        image: pytorch/pytorch:2.4.1-cuda12.1-cudnn9-runtime@sha256:ac7c098a81512e719afa5d2d497f812d7db3498f340a4b819c69cb7b3b257126
        command: [bash, /work/nautilus/run.sh]
        resources:
          requests: {cpu: "4", memory: 8Gi, ephemeral-storage: 6Gi, nvidia.com/a100: "1"}
          limits: {cpu: "4", memory: 8Gi, ephemeral-storage: 6Gi, nvidia.com/a100: "1"}
        volumeMounts:
        - name: work
          mountPath: /work
      volumes:
      - name: work
        persistentVolumeClaim:
          claimName: hw2-wikiart-gan-v1
